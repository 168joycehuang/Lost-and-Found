<style>

button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

.hd{display:flex;align-items:center;gap:10px;padding:20px 20px 12px}.hd h2{font-size:17px}.hd small{font-size:11.5px;color:var(--sub)}

.plus{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;cursor:pointer;flex:none;color:var(--ink)}.sin{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px;padding:12px 0}

.sgo{width:44px;height:44px;border-radius:50%;background:#2D5A27;display:grid;place-items:center;flex:none}.pv{position:relative;width:40px;height:40px;flex:none}.pv img{width:100%;height:100%;border-radius:10px;object-fit:cover}.pv button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#B23A32;display:grid;place-items:center}

.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}

.tgs{display:flex;flex-wrap:wrap;gap:8px}.tg2{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--brown);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600}.tg2 small{font-size:11px;font-weight:400;color:var(--sub)}
.dlg{position:fixed;inset:0;background:rgba(30,25,20,.55);display:grid;place-items:center;padding:20px;z-index:9}.dbox{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}.dbtn{display:flex;gap:10px;margin-top:8px}.dbtn .btn{flex:1}
input[type=date].in{flex:1;min-width:0;min-height:46px;-webkit-appearance:none;appearance:none}
.sp{animation:b .7s infinite alternate}@keyframes b{to{transform:translateY(-6px) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sq" viewBox="0 0 64 64"><path d="M14 20C10 8 24 6 24 18Z" fill="#8B6A4F"/><path d="M50 20C54 8 40 6 40 18Z" fill="#8B6A4F"/><circle cx="32" cy="35" r="20" fill="#D9B48C"/><circle cx="18" cy="39" r="6" fill="#EFD3AE"/><circle cx="46" cy="39" r="6" fill="#EFD3AE"/><circle cx="25" cy="31" r="2.6" fill="#3A2E26"/><circle cx="39" cy="31" r="2.6" fill="#3A2E26"/><path d="M30 41Q32 44.5 34 41Q32 39.2 30 41Z" fill="#3A2E26"/></symbol></svg>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={filter:'M4 7h16M7 12h10M10 17h4',back:'M15 18l-6-6 6-6',next:'M9 6l6 6-6 6',chev:'M6 9l6 6 6-6',edit:'M4 20l4-1 11-11-3-3L5 16z',plus:'M12 5v14M5 12h14',x:'M18 6 6 18M6 6l12 12',shield:'M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5z',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3',cam:'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 9.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7',txt:'M4 6h16M4 12h16M4 18h10',up:'M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 16 8a4 4 0 0 1 1 7.9M12 12v7M9 15l3-3 3 3',ok:'M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zM8 12.5l2.5 2.5L16 9.5',cone:'M9.2 10C9.2 7 10.4 5 12 5s2.8 2 2.8 5M7.6 10h8.8c.6 2.2-1 9.4-4.4 11.3C8.6 19.4 7 12.2 7.6 10z',warn:'M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zM12 8v5M12 16v.01',pin:'M12 21s7-7.4 7-12a7 7 0 1 0-14 0c0 4.6 7 12 7 12zM12 6.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5'};
const ic=(k,s=18,c='currentColor',w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[k]}"/></svg>`;
const mascot=s=>`<svg width="${s}" height="${s}" aria-hidden="true"><use href="#sq"/></svg>`;
const Z={工程與資訊區:['工一館','工二館','工三館','資電大樓'],文理法商區:['綜合教學大樓','文學一館','文學二館','客家學院','管理學院二館'],生活運動區:['松苑','依仁堂','羽球館','宵夜街'],公共空間:['總圖書館','大講堂','中大湖']};

/* ===== 假資料庫與模擬 API：之後只需把這一段換成 Azure / 後端呼叫，畫面不用改 ===== */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const fmt=d=>d.replace(/-/g,'/');
const rel=d=>{const n=Math.round((new Date(ymd(new Date())+'T00:00')-new Date(d+'T00:00'))/864e5);return n<=0?'剛剛':n+' 天前'};
const flt=l=>!!((l.area&&(l.area!=='other'||l.areaOther.trim()))||l.from);
const DB=[
{id:'PN-7K2M',name:'黑色折疊傘',cat:'傘',color:'黑色',mat:'',feat:'掛有松鼠吊飾',kw:'黑色折疊傘松鼠吊飾',loc:'綜合教學大樓',date:back(2),store:'留在原處',contact:'',img:.9,photos:[]},
{id:'PN-3F9D',name:'深藍色長柄傘',cat:'傘',color:'深藍色',mat:'',feat:'長柄',kw:'深藍色長柄傘',loc:'文學一館',date:back(3),store:'留在原處',contact:'',img:.55,photos:[]},
{id:'PN-8X4Q',name:'黑色短傘',cat:'傘',color:'黑色',mat:'',feat:'短傘',kw:'黑色短傘',loc:'管理學院二館',date:back(5),store:'留在原處',contact:'',img:.5,photos:[]},
{id:'PN-2H6T',name:'莫蘭迪藍水壺',cat:'水壺',color:'莫蘭迪藍',mat:'不鏽鋼',feat:'貼有粉紅貓咪貼紙',kw:'莫蘭迪藍不鏽鋼象印水壺貼有粉紅貓咪貼紙',loc:'總圖書館',date:back(1),store:'留在原處',contact:'Line：ncu_pine',img:.25,photos:[]},
{id:'PN-5R1W',name:'松鼠吊飾鑰匙',cat:'鑰匙',color:'',mat:'',feat:'松鼠吊飾鑰匙圈',kw:'鑰匙松鼠吊飾鑰匙圈',loc:'依仁堂',date:back(4),store:'依仁堂服務台',contact:'0912-345-678',img:.2,photos:[]}];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const CATS=[['傘','傘'],['水壺','水壺'],['保溫','水壺'],['鑰匙','鑰匙'],['學生證','證件'],['證','證件'],['卡','卡片'],['耳機','耳機'],['筆電','筆電'],['書','書籍'],['錢包','錢包'],['外套','衣物']],COLS=['黑','白','藍','紅','綠','粉','黃','灰','棕','紫'];
const grams=s=>{const t=s.replace(/\s/g,''),g=new Set();for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));return[...g]};
const API={
 async analyze(f){await wait(1100);const t=f.title,c=CATS.find(([k])=>t.includes(k)),l=COLS.find(k=>t.includes(k)),m=t.match(/不鏽鋼|塑膠|金屬|皮革|布/);
  return{cat:c?c[1]:'',color:l?l+'色':'',mat:m?m[0]:'',feat:''}},
 async report(f){await wait(800);const t=f.tags,it={id:'PN-'+Math.random().toString(36).slice(2,6).toUpperCase(),name:f.title.trim(),cat:t.cat||'其他',color:t.color,mat:t.mat,feat:t.feat,kw:[f.title,t.cat,t.color,t.mat,t.feat].join(''),loc:f.area==='other'?f.areaOther.trim():f.area,date:ymd(new Date()),store:f.store==='onsite'?'留在原處':f.storeOther.trim(),contact:f.contact.trim(),img:.5,photo:f.photos[0],photos:[...f.photos]};DB.unshift(it);return it},
 async claim(id){await wait(600);const i=DB.findIndex(x=>x.id===id);if(i>-1)DB.splice(i,1);return true},
 async search(q){await wait(1100);
  // 先依進階條件篩選（有設定的條件須全部符合；沒設定就不納入），再只用圖文相似度排序
  return DB.filter(it=>(!q.loc||it.loc.includes(q.loc)||q.loc.includes(it.loc))&&(!q.from||it.date>=q.from)).map(it=>{const g=grams(it.kw),m=g.filter(x=>q.desc.includes(x)).length,tx=q.desc.trim()?0.35*(q.desc.includes(it.cat)?1:0)+0.65*(g.length?m/g.length:0):null,im=q.img?it.img:null,sim=tx!==null&&im!==null?(tx+im)/2:(im!==null?im:tx);
   return{...it,pct:Math.min(99,Math.round((sim||0)*100))}}).filter(x=>x.pct>=25).sort((a,b)=>b.pct-a.pct)}};

/* ===== 狀態 ===== */
const fresh=()=>({found:{title:'',photos:[],area:'總圖書館',areaOther:'',store:'onsite',storeOther:'',contact:'',tags:{cat:'',color:'',mat:'',feat:''}},lost:{desc:'',photo:null,area:'',areaOther:'',from:''},adv:false,res:null,pick:null,last:null,from:'',flt:[],claimed:null,confirm:false,err:''});
let S=fresh(),cur='';
const set=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};

/* ===== 共用元件 ===== */
const hd=(t,back,step)=>`<div class="hd"><button class="bk" data-go="${back}" aria-label="返回上一步">${ic('back')}</button><div><h2>${t}</h2>${step?`<small>步驟 ${step} / 2</small>`:''}</div></div>${step?`<div class="bar"><i class="on"></i><i class="${step>1?'on':''}"></i></div>`:''}`;
const ft=b=>`<div class="ft">${b}</div>`;
const err=()=>S.err?`<div class="err" role="alert">${ic('warn',18,'currentColor')}<span>${esc(S.err)}</span></div>`:'';
const row=(k,v)=>`<div class="row"><span class="sub" style="font-size:12.5px">${k}</span><b>${esc(v)}</b></div>`;
const sel=(id,path,v,any)=>`<div style="position:relative"><span style="position:absolute;left:14px;top:13px;color:var(--pine);pointer-events:none">${ic('pin',16)}</span><select id="${id}" class="in" data-bind="${path}" aria-label="地點">${any?`<option value=""${v===''?' selected':''}>不限</option>`:''}${Object.entries(Z).map(([g,a])=>`<optgroup label="${g}">${a.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</optgroup>`).join('')}<optgroup label="其他"><option value="other"${v==='other'?' selected':''}>其他（自填）</option></optgroup></select><span style="position:absolute;right:14px;top:13px;color:var(--sub);pointer-events:none">${ic('chev',16)}</span></div>`;
const qr=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;const N=21,rnd=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;let r='';
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(rnd()>.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 for(const[x,y]of[[0,0],[14,0],[0,14]])r+=`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 return`<svg width="140" height="140" viewBox="-1 -1 23 23" fill="#241b16" role="img" aria-label="領取憑證 QR Code 示意圖" style="background:#fff;border-radius:8px;display:block;margin:0 auto">${r}</svg>`};
const busy=m=>{let d=$('.busy');if(!m){d&&d.remove();return}d=document.createElement('div');d.className='busy';d.setAttribute('role','status');d.innerHTML=`<div><svg class="sp" width="44" height="44"><use href="#sq"/></svg><p style="margin:8px 0 0">${m}</p></div>`;document.body.append(d)};

/* ===== 畫面 ===== */
/* 首頁清單：目前直接讀 DB；接後端時換成 API 取得「待認領」物品即可 */
const pending=()=>{const L=[...DB].sort((a,b)=>b.date.localeCompare(a.date));return`<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="font-size:16px">尚未領取的遺失物</h2><span class="sub">共 ${L.length} 件</span></div>${L.length?L.map(x=>`<button class="res" data-act="view" data-id="${x.id}" aria-label="查看${esc(x.name)}"><span class="th">${x.photo?`<img src="${x.photo}" alt="">`:ic('cone',26,'#fff',1.8)}</span><span style="flex:1"><b style="font-size:14.5px;display:block">${esc(x.name)}</b><span class="sub" style="display:block;margin-top:3px">拾獲於 ${esc(x.loc)}</span><span class="sub" style="display:block;margin-top:2px">${fmt(x.date)}．${rel(x.date)}</span></span></button>`).join(''):`<div class="card ctr sub" style="padding:28px 16px">目前沒有等待領取的遺失物</div>`}</div>`};

const home=()=>`<div class="hero"><div style="width:76px;height:76px;border-radius:50%;background:rgba(45,90,39,.12);display:grid;place-items:center">${mascot(54)}</div><div><h1>松果在哪裡</h1><span style="font-size:13.5px">中央大學智慧失物招領平台</span></div></div>
<div class="bd" style="gap:20px;flex:none"><button class="big a" data-go="found-1"><span class="ic">${ic('cone',26,'#fff',1.6)}</span><span style="flex:1"><b>我撿到了一個遺失物</b><small>通報拾獲物品，幫同學找回失物</small></span>${ic('next',20,'#fff')}</button>${sbox()}${pending()}</div>`;

const found1=()=>{const f=S.found;return hd('通報拾獲物品','home',1)+`<div class="bd"><p class="p">幫忙拍下拾獲物品的正面與特徵細節，阿果會自動幫你辨識。</p>
<div><label class="lb" for="ft">物品標題</label><input id="ft" class="in" data-bind="found.title" value="${esc(f.title)}" placeholder="簡短描述這項物品，如：藍色不鏽鋼水壺"></div>
<div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><span class="lb" style="margin:0">上傳物品照片</span><span class="sub">已上傳 <b style="color:var(--pine)">${f.photos.length}</b> / 3</span></div>
<div class="photos">${[0,1,2].map(i=>f.photos[i]?`<div class="ph"><img src="${f.photos[i]}" alt="已上傳的物品照片"><button class="x" data-act="rm" data-i="${i}" aria-label="移除這張照片">${ic('x',13,'var(--cdark)',2.6)}</button></div>`:`<div class="ph"><label>${ic('plus',28,'var(--pine)',2.2)}<input type="file" accept="image/*" hidden data-file="found" aria-label="新增照片"></label></div>`).join('')}</div>
<div style="display:flex;gap:6px;margin-top:14px;align-items:center;color:var(--sub)">${ic('shield',14)}<span class="sub" style="font-size:11px">小提醒：請避免拍到學生證、提款卡等個人資訊正面</span></div></div>
<div><span class="lb">拾獲地點</span>${sel('fa','found.area',f.area)}${f.area==='other'?`<input class="in" style="margin-top:10px" data-bind="found.areaOther" value="${esc(f.areaOther)}" placeholder="請輸入拾獲地點，如：某棟大樓或場地名稱" aria-label="自填拾獲地點">`:''}</div>
<div><span class="lb">失主該去哪裡領取</span><div style="display:flex;flex-direction:column;gap:12px">${[['onsite','留在原處','物品留在拾獲地點附近顯眼處，方便失主原地尋獲'],['other','其他（自填）','自行填寫保管地點']].map(([id,t,s])=>`<button class="opt${f.store===id?' on':''}" data-act="store" data-v="${id}"><span class="ico">${ic('pin',20)}</span><span style="flex:1"><b style="font-size:14.5px;display:block;${f.store===id?'color:var(--pine)':''}">${t}</b><span class="sub" style="display:block;margin-top:3px;line-height:1.5">${s}</span></span>${f.store===id?ic('ok',20,'var(--pine)',2.4):''}</button>`).join('')}${f.store==='other'?`<input class="in" data-bind="found.storeOther" value="${esc(f.storeOther)}" placeholder="請輸入保管地點，如：系辦、警衛室" aria-label="自填保管地點">`:''}</div></div>
<div><label class="lb" for="fc">留下你的聯絡方式（選填）</label><input id="fc" class="in" data-bind="found.contact" value="${esc(f.contact)}" placeholder="手機號碼或 Line ID，方便核對時聯繫你"></div>${err()}</div>`+ft(`<button class="btn" data-act="toStep2">下一步：AI 辨識微調 ${ic('next')}</button>`)};

const found2=()=>{const f=S.found,t=f.tags,sens=['證件','卡片'].includes(t.cat);return hd('AI 辨識微調','found-1',2)+`<div class="bd"><p class="p">阿果已經根據你上傳的照片自動產生以下標籤，確認無誤或點擊微調。</p>
<div class="card" style="box-shadow:0 10px 24px rgba(92,64,51,.08)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${mascot(28)}<b style="font-size:13px">阿果聞一聞，馬上就認出來了！</b></div>
<div style="display:flex;gap:8px;margin-bottom:12px">${f.photos.map(u=>`<div class="mk${sens?' m':''}"><img src="${u}" alt="拾獲物品照片"></div>`).join('')}</div>
<div class="sub" style="margin-bottom:12px">AI辨識產生之標籤可直接點擊修改</div>
<div style="display:flex;flex-direction:column;gap:8px">${[['cat','類別'],['color','顏色'],['mat','材質／品牌'],['feat','特徵']].map(([k,l])=>`<div class="tag"><label for="t${k}">${l}：</label><input id="t${k}" data-bind="found.tags.${k}" value="${esc(t[k])}" placeholder="請補充" aria-label="${l}，可編輯"><span style="color:var(--brown);opacity:.6">${ic('edit',12)}</span></div>`).join('')}</div></div>
${sens?`<div class="card" style="display:flex;gap:10px;align-items:flex-start;color:var(--pine)">${ic('shield',18)}<span style="font-size:12.5px;color:var(--ink)">偵測到證件／卡片，阿果已自動遮蔽學號、姓名與卡號（示意）。</span></div>`:''}
${err()}</div>`+ft(`<button class="btn" data-act="report">確認送出 ${ic('next')}</button>`)};

const foundDone=()=>{const it=S.last;return`<div class="bd ctr" style="padding-top:64px"><div class="ok">${ic('ok',46,'currentColor',2.2)}</div><div><h2 style="font-size:20px;margin-bottom:8px;line-height:1.5">太棒了！成功上傳了</h2><p class="p" style="font-size:13px">感謝你幫助同學找回遺失的物品</p></div>
<div class="card" style="width:100%;padding:22px;text-align:left;box-shadow:0 10px 26px rgba(92,64,51,.08)"><div class="sub" style="letter-spacing:1px;margin-bottom:14px">通報紀錄摘要</div><div style="display:flex;flex-direction:column;gap:12px">${row('物品',it.name)}${row('拾獲地點',it.loc)}${row('失主該去哪裡領取',it.store)}${row('備註（聯絡方式）',it.contact||'無')}<div class="row"><span class="sub" style="font-size:12.5px">狀態</span><b style="color:var(--pine);font-weight:700">待認領</b></div></div></div></div>`+ft(`<button class="btn" data-go="home">返回首頁</button>`)};

const sbox=()=>{const l=S.lost,fa=flt(l),today=ymd(new Date());return`<div style="display:flex;flex-direction:column;gap:20px"><div class="sbar"><label class="plus" aria-label="上傳舊照片">${ic('plus',22)}<input type="file" accept="image/*" hidden data-file="lost"></label>${l.photo?`<span class="pv"><img src="${l.photo}" alt="已上傳的舊照片"><button data-act="rmLost" aria-label="移除照片">${ic('x',11,'#fff',3)}</button></span>`:''}<input id="ld" class="sin" data-bind="lost.desc" value="${esc(l.desc)}" placeholder="描述你弄丟的物品，或點 + 上傳照片" aria-label="描述你弄丟的物品" enterkeyhint="search"><button class="sgo" data-act="search" aria-label="開始尋找我的松果">${ic('search',20,'#fff')}</button><button class="sflt" data-act="adv" aria-label="進階檢索${fa?'（已設定條件）':''}" aria-expanded="${S.adv}">${ic('filter',20,'var(--pine)')}${fa?'<span style="position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:1.5px solid var(--card)"></span>':''}</button></div>
${S.adv?`<div class="card" style="display:flex;flex-direction:column;gap:18px"><div><label class="lb" for="la">遺失地點</label>${sel('la','lost.area',l.area,1)}${l.area==='other'?`<input class="in" style="margin-top:10px" data-bind="lost.areaOther" value="${esc(l.areaOther)}" placeholder="請輸入遺失地點，如：某棟大樓或場地名稱" aria-label="自填遺失地點">`:''}</div>
<div><label class="lb" for="ld1">遺失日期</label><input id="ld1" type="date" class="in" style="width:100%;flex:none" data-bind="lost.from" value="${l.from}" max="${today}" aria-label="開始日期，範圍到今天"><div class="sub" style="margin-top:6px">點選日曆挑選起始日期，搜尋範圍會到今天為止</div></div>
${fa?`<button class="btn g" data-act="clrFlt" style="padding:11px;font-size:13.5px">清除條件</button>`:''}</div>`:''}${err()}</div>`};

const lost2=()=>hd('相似度排行','home')+`<div class="bd" style="gap:14px"><p class="p" style="font-size:12.5px">依照文字或圖片特徵，幫你列出可能的遺失物。</p>${S.flt&&S.flt.length?`<p class="sub" style="margin:0">已套用條件：${S.flt.map(esc).join('．')}</p>`:''}${S.res.length?S.res.map((x,n)=>`<button class="res${n?'':' top'}" data-act="pick" data-id="${x.id}" aria-label="查看${esc(x.name)}，相似度 ${x.pct}%">${n?'':'<span class="badge">最佳配對</span>'}<span class="th">${x.photo?`<img src="${x.photo}" alt="">`:ic('cone',26,'#fff',1.8)}</span><span style="flex:1"><b style="font-size:14.5px;display:block">${esc(x.name)}</b><span class="sub" style="display:block;margin-top:3px">拾獲於 ${esc(x.loc)}．${rel(x.date)}</span><span style="display:flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;font-weight:700;color:${n?'var(--brown)':'var(--sub)'}">${n?ic('cone',14,'var(--gold)'):''}${x.pct}% 相似度</span></span></button>`).join(''):`<div class="card ctr sub" style="padding:28px 16px">阿果還沒找到相似的松果。回上一步調整描述，或放寬進階檢索的條件，再試一次。</div>`}<p class="sub" style="text-align:center;margin:0">沒有看到你的物品？試著提供更多線索</p></div>`;

const item=()=>{const it=S.pick,sens=['證件','卡片'].includes(it.cat),ph=it.photos||[],when=fmt(it.date)+'（'+rel(it.date)+'）',
 tg=[['類別',it.cat],['顏色',it.color],['材質／品牌',it.mat],['特徵',it.feat]].filter(([,v])=>v),
 st=it.store==='留在原處'?'留在原處（'+it.loc+' 附近）':it.store;
 return hd('物品詳情',S.from==='home'?'home':'lost-2')+`<div class="bd" style="gap:18px">
<div class="gal" aria-label="物品照片，可左右滑動">${ph.length?ph.map((u,i)=>`<div class="sl${sens?' m':''}"><img src="${u}" alt="${esc(it.name)}照片 ${i+1}"></div>`).join(''):`<div class="sl" role="img" aria-label="尚無照片">${ic('cone',56,'#fff',1.6)}</div>`}</div>
${ph.length>1?`<div class="sub" style="text-align:center;margin-top:-8px">左右滑動查看全部 ${ph.length} 張照片</div>`:''}
<div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><h2 style="font-size:20px;line-height:1.4">${esc(it.name)}</h2><span class="st">待認領</span></div>${it.pct!=null?`<div class="sub" style="margin-top:4px">${it.pct}% 相似度</div>`:''}</div>
${tg.length?`<div><span class="lb">物品特徵</span><div class="tgs">${tg.map(([k,v])=>`<span class="tg2"><small>${k}</small>${esc(v)}</span>`).join('')}</div></div>`:''}
<div class="card" style="display:flex;flex-direction:column;gap:12px">${row('拾獲地點',it.loc)}${row('拾獲時間',when)}${row('領取地點',st)}${row('拾獲者聯絡方式',it.contact||'未提供')}</div>
${sens?`<div class="card" style="display:flex;gap:10px;align-items:flex-start;color:var(--pine)">${ic('shield',18)}<span style="font-size:12.5px;color:var(--ink)">此物品屬證件／卡片，照片已遮蔽學號、姓名與卡號（示意）。</span></div>`:''}</div>${S.confirm?`<div class="dlg"><div class="dbox" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt" style="font-size:17px;line-height:1.6">請確認遺失物為本人之物品並確實領取後再點擊</h2><p class="p">是否已確認並領取「${esc(it.name)}」？</p><div class="dbtn"><button class="btn g" data-act="cancelClaim" data-autofocus>否</button><button class="btn" data-act="doClaim">是</button></div></div></div>`:''}`+ft(`<button class="btn" data-act="claim">領取遺失物</button><button class="btn g" data-go="home">回到首頁</button>`)};

const claimDone=()=>{const it=S.claimed;return`<div class="bd ctr" style="padding-top:64px"><div class="ok">${ic('ok',46,'currentColor',2.2)}</div><div><h2 style="font-size:20px;margin-bottom:8px;line-height:1.5">領取完成！</h2><p class="p" style="font-size:13px">「${esc(it.name)}」已標記為已領取</p></div></div>`+ft(`<button class="btn" data-go="home">返回首頁</button>`)};

/* ===== 路由與事件 ===== */
const R={home,'found-1':found1,'found-2':found2,'found-done':foundDone,'lost-2':lost2,item,'claim-done':claimDone};
const need={'found-2':()=>S.found.photos.length,'found-done':()=>S.last,'lost-2':()=>S.res,'item':()=>S.pick,'claim-done':()=>S.claimed};
function render(){let k=location.hash.slice(1)||'home';if(!R[k]||(need[k]&&!need[k]())){location.replace('#home');return}
 if(k==='home'&&cur!=='home'&&cur!=='lost-2')S=fresh();if(k!==cur){S.err='';S.confirm=false;cur=k;window.scrollTo(0,0)}
 $('#app').innerHTML=R[k]();{const a=$('[data-autofocus]');a&&a.focus({preventScroll:true})}document.title=k==='home'?'松果在哪裡 PineFinder':'松果在哪裡｜'+(k.startsWith('found')?'通報拾獲':'協尋失物')}
const re=()=>{const y=scrollY;render();scrollTo(0,y)},fail=m=>{S.err=m;re()},go=h=>{location.hash=h};
addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.confirm){S.confirm=false;re()}if(e.key==='Enter'&&e.target.id==='ld')$('[data-act=search]').click()});
document.addEventListener('input',e=>{const p=e.target.dataset.bind;if(p&&e.target.tagName!=='SELECT')set(p,e.target.value)});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.bind&&(t.tagName==='SELECT'||t.type==='date')){set(d.bind,t.value);re()}
 if(d.file&&t.files[0]){const u=URL.createObjectURL(t.files[0]);d.file==='found'?S.found.photos.push(u):S.lost.photo=u;S.err='';re()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-act]');if(!b)return;const{go:g,act,i,v,id}=b.dataset,f=S.found,l=S.lost;
 if(g)return go(g);
 if(act==='rm'){f.photos.splice(+i,1);re()}
 else if(act==='store'){f.store=v;re()}

 else if(act==='clrFlt'){l.area='';l.areaOther='';l.from='';re()}
 else if(act==='rmLost'){l.photo=null;re()}
 else if(act==='adv'){S.adv=!S.adv;re()}
 else if(act==='toStep2'){
  if(!f.photos.length)return fail('請至少上傳 1 張物品照片，阿果才能幫你辨識');
  if(!f.title.trim())return fail('請填寫物品標題');
  if(f.area==='other'&&!f.areaOther.trim())return fail('請輸入拾獲地點');
  if(f.store==='other'&&!f.storeOther.trim())return fail('請輸入保管地點');
  busy('阿果正在嗅聞特徵⋯');f.tags=await API.analyze(f);busy();go('found-2')}
 else if(act==='report'){
  
  busy('阿果正在藏松果⋯');S.last=await API.report(f);busy();go('found-done')}
 else if(act==='search'){
  if(!l.photo&&l.desc.trim().length<2)return fail('請輸入物品描述，或點 + 上傳一張照片');
  if(l.area==='other'&&!l.areaOther.trim())return fail('請輸入遺失地點');
  const loc=l.area==='other'?l.areaOther.trim():l.area,fl=[];if(loc)fl.push('地點：'+loc);if(l.from)fl.push('日期：'+fmt(l.from)+' ～ 今天');
  busy('阿果正在翻松葉堆⋯');S.res=await API.search({img:!!l.photo,desc:l.desc,loc,from:l.from});S.flt=fl;busy();go('lost-2')}
 else if(act==='claim'){S.confirm=true;re()}
 else if(act==='cancelClaim'){S.confirm=false;re()}
 else if(act==='doClaim'){busy('阿果正在登記領取⋯');await API.claim(S.pick.id);busy();S.claimed=S.pick;S.res=S.res&&S.res.filter(x=>x.id!==S.pick.id);S.pick=null;S.confirm=false;go('claim-done')}
 else if(act==='pick'){S.pick=S.res.find(x=>x.id===id);S.from='search';go('item')}
 else if(act==='view'){S.pick=DB.find(x=>x.id===id);S.from='home';go('item')}
});
render();
</script></body></html>
