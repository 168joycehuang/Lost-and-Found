<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sq" viewBox="0 0 64 64"><path d="M14 20C10 8 24 6 24 18Z" fill="#8B6A4F"/><path d="M50 20C54 8 40 6 40 18Z" fill="#8B6A4F"/><circle cx="32" cy="35" r="20" fill="#D9B48C"/><circle cx="18" cy="39" r="6" fill="#EFD3AE"/><circle cx="46" cy="39" r="6" fill="#EFD3AE"/><circle cx="25" cy="31" r="2.6" fill="#3A2E26"/><circle cx="39" cy="31" r="2.6" fill="#3A2E26"/><path d="M30 41Q32 44.5 34 41Q32 39.2 30 41Z" fill="#3A2E26"/></symbol></svg>
<div id="app"></div>
<script src="./config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={filter:'M4 7h16M7 12h10M10 17h4',back:'M15 18l-6-6 6-6',next:'M9 6l6 6-6 6',chev:'M6 9l6 6 6-6',edit:'M4 20l4-1 11-11-3-3L5 16z',plus:'M12 5v14M5 12h14',x:'M18 6 6 18M6 6l12 12',shield:'M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5z',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3',cam:'M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 9.5a3.5 3.5 0 1 0 0 7',txt:'M4 6h16M4 12h16M4 18h10',up:'M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 16 8a4 4 0 0 1 1 7.9M12 12v7M9 15l3-3 3 3',arrowTop:'M12 19V5M5 12l7-7 7 7',ok:'M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zM8 12.5l2.5 2.5L16 9.5',cone:'M9.2 10C9.2 7 10.4 5 12 5s2.8 2 2.8 5M7.6 10h8.8c.6 2.2-1 9.4-4.4 11.3C8.6 19.4 7 12.2 7.6 10z',warn:'M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zM12 8v5M12 16v.01',pin:'M12 21s7-7.4 7-12a7 7 0 1 0-14 0c0 4.6 7 12 7 12zM12 6.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5'};
const ic=(k,s=18,c='currentColor',w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[k]}"/></svg>`;
const mascot=s=>{const path=String(window.PINEFINDER_CONFIG?.mascotImage||'./assets/pinecone-mascot.png');return`<span class="mascot-wrap" style="width:${s}px;height:${s}px"><img class="mascot-photo" src="${esc(path)}" alt="松鼠吉祥物" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="mascot-fallback" aria-hidden="true"><svg width="${s}" height="${s}"><use href="#sq"/></svg></span></span>`};
const Z={工程與資訊區:['工一館','工二館','工三館','資電大樓'],文理法商區:['綜合教學大樓','文學一館','文學二館','客家學院','管理學院二館'],生活運動區:['松苑','依仁堂','羽球館','宵夜街'],公共空間:['總圖書館','大講堂','中大湖']};

/* ===== Supabase REST API ===== */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const fmt=d=>d.replace(/-/g,'/');
const rel=d=>{const n=Math.round((new Date(ymd(new Date())+'T00:00')-new Date(d+'T00:00'))/864e5);return n<=0?'剛剛':n+' 天前'};
const flt=l=>!!((l.area&&(l.area!=='other'||l.areaOther.trim()))||l.from);
let DB=[];
const CONFIG=window.PINEFINDER_CONFIG||{};
const SUPABASE_URL=String(CONFIG.supabaseUrl||'').replace(/\/$/,'');
const SUPABASE_KEY=String(CONFIG.supabaseKey||'');
const STORAGE_BUCKET=String(CONFIG.storageBucket||'lost-items');
const IMAGE_TYPES={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
const ensureConfigured=()=>{if(!SUPABASE_URL||!SUPABASE_KEY)throw Error('尚未設定 Supabase。請依 README 設定 frontend/config.js 的專案網址與 anon/publishable key。')};
const supabaseRequest=async(path,{headers={},...options}={})=>{
 ensureConfigured();
 const response=await fetch(`${SUPABASE_URL}${path}`,{...options,headers:{apikey:SUPABASE_KEY,...headers}});
 const body=await response.text();
 let data=null;
 try{data=body?JSON.parse(body):null}catch{data=body}
 if(!response.ok)throw Error(data?.message||data?.msg||data?.hint||data?.details||`Supabase 請求失敗（${response.status}）`);
 return data
};
const publicPhotoUrl=path=>/^https?:\/\//i.test(path)?path:`${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(STORAGE_BUCKET)}/${path.split('/').map(encodeURIComponent).join('/')}`;
const apiItem=row=>{const photos=(row.photos||[]).map(publicPhotoUrl),legacyFeatures=(row.features||'').split(/[、,，;；\n]+/).map(value=>value.trim()).filter(Boolean),hasSplitFeatures=Object.hasOwn(row,'other_feature_1');return{id:row.id,name:row.name,cat:row.category,color:row.color,other1:hasSplitFeatures?row.other_feature_1||'':legacyFeatures[0]||'',other2:hasSplitFeatures?row.other_feature_2||'':legacyFeatures[1]||'',other3:hasSplitFeatures?row.other_feature_3||'':legacyFeatures.slice(2).join('、'),kw:row.keywords,loc:row.location,date:row.found_at,store:row.pickup_location,contact:row.contact,photos,photo:photos[0]||null,status:row.status}};
const uploadPhoto=async photo=>{
 const extension=IMAGE_TYPES[photo.type];
 if(!extension)throw Error('照片僅支援 JPEG、PNG 或 WebP 格式');
 if(photo.size>8*1024*1024)throw Error('單張照片不可超過 8 MB');
 const path=`${ymd(new Date())}/${crypto.randomUUID()}.${extension}`;
 await supabaseRequest(`/storage/v1/object/${encodeURIComponent(STORAGE_BUCKET)}/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'POST',headers:{'Content-Type':photo.type,'x-upsert':'false'},body:photo});
 return path
};
const API={
async list(){const rows=await supabaseRequest('/rest/v1/lost_items?select=id,name,category,color,features,other_feature_1,other_feature_2,other_feature_3,keywords,location,found_at,pickup_location,contact,photos,status&status=eq.pending&order=found_at.desc');return rows.map(apiItem)},
async analyze(f){
 ensureConfigured();
 const form=new FormData();
 form.set('title',f.title.trim());
 f.photoFiles.forEach(file=>form.append('images',file));
 const response=await fetch(`${SUPABASE_URL}/functions/v1/analyze-item`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:form});
 const body=await response.json().catch(()=>null);
 if(!response.ok)throw Error(body?.error||`AI 辨識失敗（${response.status}）`);
 if(body?.blocked===true)return{blocked:true};
 if(!Array.isArray(body?.tags)||body.tags.length>3||!Array.isArray(body.imageCategories)||body.imageCategories.length!==f.photoFiles.length||body.imageCategories.some(category=>typeof category!=='string'))throw Error('AI 回傳格式不完整，請重試');
 return{blocked:false,cat:body.category||'',color:body.color||'',imageCategories:body.imageCategories,other1:body.tags[0]||'',other2:body.tags[1]||'',other3:body.tags[2]||''}
},
async report(f){
 const t=f.tags,embedding=await this.embed(itemSearchText(f.title,t)),photoPaths=[];
 for(let i=0;i<f.photoFiles.length;i++)photoPaths.push(f.photoPaths[i]||await uploadPhoto(f.photoFiles[i]));
 const values={id:`PN-${crypto.randomUUID().replaceAll('-','').slice(0,12).toUpperCase()}`,name:f.title.trim(),category:t.cat||'其他',color:t.color,material:'',features:'',other_feature_1:t.other1.trim(),other_feature_2:t.other2.trim(),other_feature_3:t.other3.trim(),keywords:[f.title,t.cat,t.color,t.other1,t.other2,t.other3].filter(Boolean).join(' ').slice(0,1000),embedding,location:f.area==='other'?f.areaOther.trim():f.area,found_at:ymd(new Date()),pickup_location:f.store==='onsite'?'留在原處':f.storeOther.trim(),contact:f.contact.trim(),photos:photoPaths,status:'pending',created_at:new Date().toISOString()};
 const rows=await supabaseRequest('/rest/v1/lost_items?select=id,name,category,color,features,other_feature_1,other_feature_2,other_feature_3,keywords,location,found_at,pickup_location,contact,photos,status',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(values)});
 if(!rows?.length)throw Error('通報已送出，但 Supabase 未回傳新增資料');
 return apiItem(rows[0])
},
async embed(text){
 ensureConfigured();
 const response=await fetch(`${SUPABASE_URL}/functions/v1/embed-text`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({text})});
 const body=await response.json().catch(()=>null);
 if(!response.ok)throw Error(body?.error||`文字向量產生失敗（${response.status}）`);
 if(!Array.isArray(body?.embedding)||body.embedding.length!==1536||body.embedding.some(value=>typeof value!=='number'||!Number.isFinite(value)))throw Error('文字向量格式錯誤，請稍後再試');
 return body.embedding
},

 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(rnd()>.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 for(const[x,y]of[[0,0],[14,0],[0,14]])r+=`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;

function render(){let k=location.hash.slice(1)||'home';if(!R[k]||(need[k]&&!need[k]())){location.replace('#home');return}
 if(k==='home'&&cur!=='home'&&cur!=='lost-2')S=fresh();if(k!==cur){S.err='';S.confirm=false;cur=k;window.scrollTo(0,0)}
 $('#app').innerHTML=R[k]()+ (k==='found-1'&&S.categoryWarning?categoryWarningDialog(S.categoryWarning):'');{const a=$('[data-autofocus]');a&&a.focus({preventScroll:true})}document.title=k==='home'?'松果在哪裡 PineFinder':k==='safety-warning'?'松果在哪裡｜內容安全提醒':'松果在哪裡｜'+(k.startsWith('found')?'通報拾獲':'協尋失物')}
const re=()=>{const y=scrollY;render();scrollTo(0,y)},fail=m=>{S.err=m;re()},go=h=>{location.hash=h};
addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.confirm){S.confirm=false;re()}if(e.key==='Escape'&&S.categoryWarning){S.categoryWarning=null;re()}if(e.key==='Enter'&&e.target.id==='ld')$('[data-act=search]').click()});
document.addEventListener('input',e=>{const p=e.target.dataset.bind;if(p&&e.target.tagName!=='SELECT'){set(p,e.target.value);if(e.target.dataset.bind.startsWith('found.tags.'))e.target.size=Math.max(1,[...e.target.value].length)}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.bind&&(t.tagName==='SELECT'||t.type==='date')){set(d.bind,t.value);re()}
 if(d.file&&t.files[0]){const file=t.files[0];if(d.file==='found'&&S.found.photoFiles.length>=3){t.value='';return fail('每筆通報最多上傳 3 張照片')}if(!IMAGE_TYPES[file.type]){t.value='';return fail('照片僅支援 JPEG、PNG 或 WebP 格式')}if(file.size>8*1024*1024){t.value='';return fail('單張照片不可超過 8 MB')}const u=URL.createObjectURL(file);S.categoryWarning=null;S.found.photos.push(u);S.found.photoFiles.push(file);S.found.photoPaths.push(null);S.err='';re()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-act]');if(!b)return;const{go:g,act,i,v,id}=b.dataset,f=S.found,l=S.lost;
 try{
 if(g)return go(g);
 if(act==='editFeature'){const field=document.getElementById(id);if(!field)return;field.readOnly=!field.readOnly;b.setAttribute('aria-label',`${field.readOnly?'編輯':'停止編輯'}${b.dataset.label}`);if(!field.readOnly)field.focus()}
 else if(act==='rm'){URL.revokeObjectURL(f.photos[+i]);f.photos.splice(+i,1);f.photoFiles.splice(+i,1);f.photoPaths.splice(+i,1);S.categoryWarning=null;re()}
 else if(act==='closeCategoryWarning'){S.categoryWarning=null;re()}
 else if(act==='continueCategoryWarning'){if(!S.categoryWarning?.analysis)return fail('找不到照片辨識結果，請重新分析');f.tags=S.categoryWarning.analysis;S.categoryWarning=null;go('found-2')}
 else if(act==='store'){f.store=v;re()}

 else if(act==='clrFlt'){l.area='';l.areaOther='';l.from='';re()}
 else if(act==='adv'){S.adv=!S.adv;re()}
 else if(act==='toStep2'){
  if(!f.photos.length)return fail('請至少上傳 1 張物品照片才能繼續');
  if(!f.title.trim())return fail('請填寫物品標題');
   if(f.area==='other'&&!f.areaOther.trim())return fail('請輸入拾獲地點');
   if(f.store==='other'&&!f.storeOther.trim())return fail('請輸入保管地點');
   busy('Azure Vision 與 AI 正在整理物品特徵⋯');const analysis=await API.analyze(f);busy();if(analysis.blocked){f.photos.forEach(URL.revokeObjectURL);S.found=fresh().found;go('safety-warning');return}if(new Set(analysis.imageCategories).size>1){S.categoryWarning={categories:analysis.imageCategories,analysis};re();return}S.categoryWarning=null;f.tags=analysis;go('found-2')}
 else if(act==='report'){
  const featureFields=[['其他特徵1',f.tags.other1],['其他特徵2',f.tags.other2],['其他特徵3',f.tags.other3]];
  const combinedFeature=featureFields.find(([,value])=>/[、,，;；\n]/.test(value));
  if(combinedFeature)return fail(`${combinedFeature[0]}請只填一項特徵`);
  busy('阿果正在藏松果⋯');S.last=await API.report(f);DB.unshift(S.last);busy();go('found-done')}
 else if(act==='showOtherResults'){S.showLowScoreResults=true;re()}
 else if(act==='scrollToTop'){window.scrollTo({top:0,behavior:'smooth'})}
 else if(act==='search'){
  if(l.desc.trim().length<1)return fail('請輸入至少 1 個字的物品描述');
  if(l.area==='other'&&!l.areaOther.trim())return fail('請輸入遺失地點');
  const loc=l.area==='other'?l.areaOther.trim():l.area,fl=[];if(loc)fl.push('地點：'+loc);if(l.from)fl.push('日期：'+fmt(l.from)+' ～ 今天');
  busy('阿果正在比對物品描述⋯');S.res=await API.search({desc:l.desc,loc,from:l.from});S.flt=fl;S.showLowScoreResults=false;busy();go('lost-2')}
 else if(act==='claim'){S.confirm=true;re()}
 else if(act==='cancelClaim'){S.confirm=false;re()}
 else if(act==='doClaim'){busy('阿果正在登記領取⋯');await API.claim(S.pick.id);DB=DB.filter(x=>x.id!==S.pick.id);busy();S.claimed=S.pick;S.res=S.res&&S.res.filter(x=>x.id!==S.pick.id);S.pick=null;S.confirm=false;go('claim-done')}
 else if(act==='pick'){S.pick=S.res.find(x=>x.id===id);S.from='search';go('item')}
 else if(act==='view'){S.pick=DB.find(x=>x.id===id);S.from='home';go('item')}
 }catch(error){busy();fail(error instanceof Error?error.message:'操作失敗，請稍後再試')}
});
render();
API.list().then(items=>{DB=items;if(cur==='home')re()}).catch(error=>{S.err=error instanceof Error?error.message:'無法載入遺失物清單';if(cur==='home')re()});
</script></body></html>
